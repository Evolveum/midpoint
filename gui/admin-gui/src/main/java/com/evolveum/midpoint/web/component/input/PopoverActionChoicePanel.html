<!DOCTYPE html>
<wicket:panel xmlns:wicket="http://wicket.apache.org">
    <div class="position-relative">
        <input wicket:id="input" class="form-control form-control-sm w-100" type="text" autocomplete="off" aria-label="Choice"/>
        <div wicket:id="popover" style="min-width: 200px;" role="dialog" aria-modal="false">
            <div class="popover-body p-0">
                <div wicket:id="choicesContainer" style="max-height: 300px; overflow-y: auto;">
                    <div wicket:id="choices">
                        <a wicket:id="choice" class="d-block px-2 py-2 text-body text-decoration-none">
                            <i wicket:id="icon" aria-hidden="true"></i>
                            <span wicket:id="choiceLabel"></span>
                        </a>
                    </div>
                </div>
                <div class="border-top">
                    <a wicket:id="action" class="d-block px-2 py-2 text-body text-decoration-none" href="#">
                        <i wicket:id="icon" aria-hidden="true"></i>
                        <span wicket:id="choiceLabel"></span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</wicket:panel>
