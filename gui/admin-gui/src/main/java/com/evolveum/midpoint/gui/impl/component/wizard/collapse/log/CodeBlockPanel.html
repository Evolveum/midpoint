<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:panel>
    <div class="border rounded mb-2">
        <div class="d-flex flex-row align-items-center justify-content-between px-2 py-1 border-bottom bg-light">
            <span class="small text-secondary fw-bold" wicket:id="label"></span>
            <a class="btn btn-sm btn-link p-0" wicket:id="copy">
                <i class="fa fa-copy"></i>
                <wicket:message key="OperationLogPanel.copy"/>
            </a>
        </div>
        <div class="p-2 overflow-x-auto">
            <div class="d-flex flex-row" wicket:id="line">
                <div class="text-secondary text-end pe-2 user-select-none" wicket:id="lineNumber"></div>
                <pre class="mb-0 flex-grow-1" wicket:id="lineContent"></pre>
            </div>
        </div>
    </div>
</wicket:panel>
</html>
