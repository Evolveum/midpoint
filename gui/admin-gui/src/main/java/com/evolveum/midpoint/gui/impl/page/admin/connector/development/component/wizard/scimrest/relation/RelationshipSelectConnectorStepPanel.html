<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:extend>
    <div wicket:id="feedbackContainer" class="col-12 feedbackContainer">
        <div wicket:id="feedback" class="messagePanel"/>
    </div>
    <div class="col-12 d-flex justify-content-end pb-3">
        <a class="btn btn-light border" wicket:id="browseMoreButton"></a>
    </div>
    <wicket:enclosure child="counter">
        <div class="col-12 d-flex flex-row px-3 pb-2 small text-secondary text-uppercase">
            <div class="col-6 ps-4">
                <wicket:message key="RelationshipSelectConnectorStepPanel.name"/>
            </div>
            <div class="col-3">
                <wicket:message key="RelationshipSelectConnectorStepPanel.subject"/>
            </div>
            <div class="col-3">
                <wicket:message key="RelationshipSelectConnectorStepPanel.object"/>
            </div>
        </div>
        <div class="col-12 p-0" wicket:id="radioGroup">
            <div class="px-3 card shadow-none mb-2 gen-select-card" wicket:id="panel">
                <div wicket:id="row"></div>
            </div>
        </div>
        <div class="col-12 pt-2" wicket:id="counter"></div>
    </wicket:enclosure>
</wicket:extend>
</html>
