<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:panel>
    <div class="d-flex flex-row collapsed-wizard-panel">
        <div class="fake-panel" wicket:id="fakePanel"></div>
        <div class="d-flex flex-row collapsed-wizard-container" style="z-index: 10;">
            <div class="collapsed-menu bg-white p-1 d-flex flex-column overflow-y-auto" wicket:id="collapsedMenu">
                <div wicket:id="menuItem" class="mb-1">
                    <a class="collapsed-menu-icon btn btn-lg p-1 w-100" wicket:id="iconButton"></a>
                    <div class="badge-parent">
                        <span wicket:id="badge"></span>
                    </div>
                </div>
            </div>
            <div class="collapsed-details-panel" wicket:id="details">
                <div class="d-flex flex-column h-100">
                    <div class="d-flex flex-row py-1">
                        <div wicket:id="detailsLabel"></div>
                        <a class="btn btn-sm px-1 align-middle ms-auto" wicket:id="closeButton" wicket:message="title:Button.close">
                            <i class="fa fa-times fa-lg align-middle"></i>
                        </a>
                    </div>
                    <div class="border-bottom mx-n2"></div>
                    <div class="p-1 h-100 overflow-y-auto overflow-x-hidden" wicket:id="detailsItem"></div>
                    <div wicket:id="footerPanel"></div>
                </div>
            </div>
        </div>
    </div>
</wicket:panel>
</html>
