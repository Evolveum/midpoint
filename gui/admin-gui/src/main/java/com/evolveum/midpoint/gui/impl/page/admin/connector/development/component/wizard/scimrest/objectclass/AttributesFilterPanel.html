<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:panel>
    <div class="col-12 p-0 mb-3 d-flex flex-wrap align-items-center gap-2">
        <form wicket:id="searchForm" class="me-auto">
            <div class="input-group">
                <input type="text" class="form-control" wicket:id="searchText"/>
                <a class="btn btn-outline-secondary" wicket:id="searchButton">
                    <i class="fa fa-search me-1"></i>
                    <wicket:message key="PageBase.button.search"/>
                </a>
            </div>
        </form>
        <div class="form-check mb-0">
            <input type="checkbox" class="form-check-input" wicket:id="filter"/>
            <label class="form-check-label" wicket:for="filter">
                <span wicket:id="filterLabel"/>
            </label>
        </div>
    </div>
</wicket:panel>
</html>
