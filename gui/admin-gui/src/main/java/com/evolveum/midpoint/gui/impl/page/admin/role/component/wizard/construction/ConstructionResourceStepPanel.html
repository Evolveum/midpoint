<html xmlns:wicket="http://wicket.apache.org">
<wicket:extend>
    <wicket:fragment wicket:id="bodyFragment">
        <div class="col-12 p-0 card shadow-sm mb-3">
            <div class="card-header py-2">
            <span>
                <i wicket:id="icon"/>
                <span wicket:id="title"/>
            </span>
            </div>
            <div wicket:id="table" class="col-12 p-0 "/>
            <div class="col-12 px-3 py-2 border-top">
                <div class="mb-2">
                    <wicket:message key="AssignmentPanel.newAssignmentParameters"/>
                </div>
                <div class="row align-items-center g-2">
                    <div class="col-auto">
                        <wicket:message key="ObjectType.lifecycleState"/>
                    </div>
                    <div class="col-auto ml-2" wicket:id="lifecycleState"/>
                </div>
            </div>
        </div>
    </wicket:fragment>
</wicket:extend>
</html>
