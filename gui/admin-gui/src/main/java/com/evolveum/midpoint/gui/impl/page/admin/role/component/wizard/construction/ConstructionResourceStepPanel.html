<html xmlns:wicket="http://wicket.apache.org">
<wicket:extend>
    <wicket:fragment wicket:id="bodyFragment">
        <div class="col-12 p-0 card shadow-sm mb-3">
            <div class="card-header py-2">
            <span>
                <i wicket:id="icon"/>
                <span wicket:id="title"/>
            </span>
            </div>
            <div wicket:id="lifecycleState" class="col-12 px-3 py-2 border-bottom"/>
            <div wicket:id="table" class="col-12 p-0 "/>
        </div>
    </wicket:fragment>
</wicket:extend>
</html>
