<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:extend>
    <div class="col-12 d-flex flex-column align-items-center text-center mt-5 pt-5">
        <i class="fa fa-check-circle text-success fa-3x mb-3"></i>
        <h4 class="mb-3 fw-semibold"><wicket:message key="AbstractConfirmCreatedObjectConnectorStepPanel.title"/></h4>
        <div class="text-secondary mb-4 col-sm-5" wicket:id="createdObjectText"></div>
        <div class="col-sm-5 text-start">
            <label class="mb-2 fw-semibold">
                <wicket:message key="AbstractConfirmCreatedObjectConnectorStepPanel.objectIdentifier"/>
            </label>
            <div class="input-group">
                <div class="form-control" wicket:id="identifier"></div>
                <a href="#" class="btn btn-outline-secondary" wicket:id="copyIdentifier"
                        wicket:message="title:AbstractConfirmCreatedObjectConnectorStepPanel.copy">
                    <i class="fa fa-copy"></i>
                </a>
            </div>
        </div>
    </div>
</wicket:extend>
</html>
