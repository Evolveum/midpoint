<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:panel>

        <label class="mb-0" wicket:for="select:input"><wicket:message key="ScriptFormatSelectPanel.label"/></label>
        <i class="fa fa-info-circle text-info clickable-by-enter" role="button" tabindex="0"
