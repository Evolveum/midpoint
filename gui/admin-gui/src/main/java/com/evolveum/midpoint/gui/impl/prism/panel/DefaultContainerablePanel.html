<html xmlns:wicket="http://wicket.apache.org">
<wicket:panel>
    <div wicket:id="showHideMessage" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
    <div class="prism-properties">
        <wicket:container wicket:id="propertiesLabel">
            <wicket:container wicket:id="properties">
                <div class="row prism-property mb-3" wicket:id="property"/>
            </wicket:container>
            <div class="row prism-property">
                <div class="col-4xl-2 col-3xl-3 col-xxl-4 col-xl-5 col-md-6 col-sm-12"/>
                <div class="col-4xl-10 col-3xl-9 col-xxl-8 col-xl-7 col-md-6 col-sm-12">
                    <div class="btn btn-link show-empty-button clickable-by-enter" wicket:id="showEmptyButton" tabindex="0"/>
                </div>
            </div>
        </wicket:container>
        <div wicket:id="containersLabel">
            <div class="prism-containers" wicket:id="containers">
                <div class="row prism-container" wicket:id="container"/>
            </div>
        </div>
    </div>
</wicket:panel>
</html>
