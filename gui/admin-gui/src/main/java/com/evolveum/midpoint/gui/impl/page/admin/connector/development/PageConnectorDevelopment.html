<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>

    <wicket:fragment wicket:id="templateView">
        <div wicket:id="template"></div>
    </wicket:fragment>
    <wicket:fragment wicket:id="wizardFragment">
        <div wicket:id="wizard"/>
    </wicket:fragment>
    <wicket:fragment wicket:id="developmentDisabledFragment">
        <div class="d-flex flex-column">
            <div class="d-flex align-items-center flex-row gap-3 mb-3">
                <a class="btn btn-link" wicket:id="backButton"/>
                <div class="mb-0 h3">
                    <wicket:message key="PageAdmin.menu.top.application.connector.generator"/>
                </div>
            </div>

            <div class="card align-items-center shadow-sm mb-3 w-100 h-100" style="min-height: 78vh;">
                <div class="d-flex flex-column col-lg-6 col-md-12 px-lg-0 px-md-2 px-sm-1 mt-lg-5 mt-md-2 mt-sm-0">
                    <div class="d-flex flex-row my-lg-5 my-md-3 my-sm-1">
                        <div>
                            <div class="p-3 rounded bg-primary-100">
                                <i class="text-primary fs-4 fas fa-lock"></i>
                            </div>
                        </div>

                        <div class="d-flex flex-column ps-4">
                            <h4 class="fw-semibold">
                                <wicket:message key="PageConnectorDevelopment.developmentDisabled.title"/>
                            </h4>
                            <div>
                                <wicket:message key="PageConnectorDevelopment.developmentDisabled.description.0"/>
                            </div>
                            <div class="pt-1">
                                <wicket:message key="PageConnectorDevelopment.developmentDisabled.description.1"/>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex flex-column">
                        <div class="pb-3">
                            <div class="card mb-0">
                                <div class="card-body d-flex flex-column">
                                    <div class="d-flex flex-row">
                                        <div class="">
                                            <i class="text-primary fas fa-shield"></i>
                                        </div>
                                        <div class="ps-2 d-flex flex-column">
                                            <div class="fw-semibold">
                                                <wicket:message key="PageConnectorDevelopment.developmentDisabled.recommendation.title"/>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="pt-2">
                                        <wicket:message key="PageConnectorDevelopment.developmentDisabled.recommendation.description.0"/>
                                    </div>
                                    <div class="pt-1">
                                        <wicket:message key="PageConnectorDevelopment.developmentDisabled.recommendation.description.1"/>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <div class="card mb-0">
                                <div class="card-body d-flex flex-column">
                                    <div class="d-flex flex-row">
                                        <div class="">
                                            <i class="text-primary fas fa-circle-question"></i>
                                        </div>
                                        <div class="ps-2 d-flex flex-column">
                                            <div class="fw-semibold">
                                                <wicket:message key="PageConnectorDevelopment.developmentDisabled.howCanUse.title"/>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="pt-2">
                                        <wicket:message key="PageConnectorDevelopment.developmentDisabled.howCanUse.description.0"/>
                                    </div>
                                    <div class="pt-1">
                                        <a class="btn btn-sm btn-outline-primary"
                                                href="https://docs.evolveum.com/midpoint/get-started/install/"
                                                target="_blank"
                                                rel="noopener noreferrer">
                                            <wicket:message key="PageConnectorDevelopment.developmentDisabled.howCanUse.button.0"/>
                                        </a>
                                    </div>
                                    <div class="pt-3">
                                        <wicket:message key="PageConnectorDevelopment.developmentDisabled.howCanUse.description.1"/>
                                    </div>
                                    <div class="pt-1">
                                        <a class="btn btn-sm btn-outline-primary"
                                                href="https://docs.evolveum.com/midpoint/reference/master/connector-generator/enable/"
                                                target="_blank"
                                                rel="noopener noreferrer">
                                            <wicket:message key="PageConnectorDevelopment.developmentDisabled.howCanUse.button.1"/>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="text-muted mt-2">
                            <i class="fas fa-circle-info pe-1"></i>
                            <wicket:message key="PageConnectorDevelopment.developmentDisabled.footer"/>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </wicket:fragment>
    <wicket:child/>

</wicket:extend>
</body>
</html>
