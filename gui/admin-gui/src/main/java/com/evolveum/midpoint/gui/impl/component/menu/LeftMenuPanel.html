<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:wicket="http://wicket.apache.org">
    <body>
        <wicket:panel>
            <wicket:enclosure child="menu">
                <div class="sidebar-brand p-0 border-0 app-header">
                    <a class="brand-link custom-logo border-bottom-0 p-0 d-flex align-items-center justify-content-center" wicket:id="customLogo" wicket:message="aria-label:LeftMenuPanel.customLogo">
                        <i wicket:id="customLogoImgCss"/>
                        <img wicket:id="customLogoImgSrc"/>
                    </a>
                    <a class="brand-link logo border-bottom-0" wicket:id="logo" wicket:message="aria-label:LeftMenuPanel.logo">
                        <span>&nbsp;</span>
                    </a>
                </div>
                <wicket:remove>
                    The toggle sits between the logo and the menu so that focus and reading order are
                    logo, toggle, menu (WCAG 2.2, 2.4.3). It is drawn in the header, next to the sidebar edge, by CSS.
                </wicket:remove>
                <div wicket:id="menuToggle" class="app-header app-menu-toggle navbar navbar-expand border-bottom-0">
                    <a class="nav-link menu-toggle" data-lte-toggle="sidebar" href="#" role="button" aria-controls="navigation"
                            wicket:message="title:Accessibility.PageBase.pushmenu.title,data-title-collapsed:Accessibility.PageBase.pushmenu.title.expand,data-title-expanded:Accessibility.PageBase.pushmenu.title,data-collapsed-message:Accessibility.PageBase.pushmenu.switchedToCompact,data-expanded-message:Accessibility.PageBase.pushmenu.switchedToFull"><i class="fas fa-bars"></i></a>
                    <span id="menuToggleStatus" aria-live="polite" class="visually-hidden"></span>
                </div>
                <div class="sidebar-wrapper">
                    <wicket:container wicket:id="menu"/>
                </div>
            </wicket:enclosure>
        </wicket:panel>
    </body>
</html>
