<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:panel>
    <label class="d-flex flex-row align-items-center w-100 m-0 py-2 cursor-pointer">
        <div class="col-6 d-flex flex-row align-items-center gap-2">
            <input class="form-check-input mt-0" type="radio" wicket:id="selectionRadio"/>
            <span wicket:id="name"></span>
        </div>
        <div class="col-3" wicket:id="subjectSide"></div>
        <div class="col-3" wicket:id="objectSide"></div>
    </label>
</wicket:panel>
</html>
