<html xmlns:wicket="http://wicket.apache.org">
<wicket:panel>

    <div wicket:id="container" class="d-flex flex-column col h-100 bg-white rounded-start border border-light p-0">
        <div class="d-flex flex-column justify-content-center p-1 gap-2"
                style="min-height: 58px;" wicket:id="header"> <!--     inner border of footer and outer hr here -2px-->
            <div wicket:id="header-item"
                    class="btn btn-outline-dark border-0 d-flex align-items-center justify-content-start align-self-stretch p-1 "></div>
        </div>

        <hr width="100%" class="m-0 bg-light"/>

        <div class="d-flex flex-column justify-content-center gap-2 p-1" wicket:id="sub-header">
            <div wicket:id="sub-header-item"
                    class="btn btn-outline-dark border-0 d-flex align-items-center justify-content-start align-self-stretch p-1 "></div>
        </div>

        <hr width="100%" class="m-0 bg-light"/>

        <div style="height:100%; overflow-y: scroll; overflow-x: hidden; -ms-overflow-style: none; scrollbar-width: none; ">
            <div class="d-flex flex-column justify-content-center gap-2 p-1" wicket:id="body">
                <div wicket:id="patterns">
                    <div wicket:id="pattern"></div>
                </div>
            </div>
        </div>

        <hr width="100%" class="m-0 bg-light"/>

        <div class="d-flex flex-column justify-content-center gap-2 p-1"
                style="min-height: 58px;" wicket:id="footer"> <!--     inner border of footer and outer hr here -2px-->
            <div wicket:id="footer-item"
                    class="btn btn-outline-dark border-0 d-flex align-items-center justify-content-start align-self-stretch p-1 "></div>
        </div>
    </div>

</wicket:panel>
</html>
