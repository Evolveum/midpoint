<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:panel>
    <div class="d-flex flex-column h-100">
        <div class="d-flex flex-row flex-wrap align-items-center justify-content-between mb-2 gap-2">
            <div wicket:id="filter"></div>
            <a class="btn btn-sm btn-link text-nowrap" wicket:id="exportAll">
                <i class="fa fa-download"></i>
                <wicket:message key="OperationLogPanel.exportAll"/>
            </a>
        </div>
        <div class="text-secondary small py-3" wicket:id="empty">
            <wicket:message key="OperationLogPanel.empty"/>
        </div>
        <div class="d-flex flex-column gap-2 overflow-y-auto">
            <div class="border rounded p-2" wicket:id="entry">
                <div class="d-flex flex-row align-items-start gap-2">
                    <span class="mt-1" wicket:id="levelBadge"></span>
                    <div class="flex-grow-1 overflow-hidden">
                        <div class="d-flex flex-row justify-content-between">
                            <span class="fw-bold" wicket:id="source"></span>
                            <span class="text-secondary small text-nowrap ps-2" wicket:id="time"></span>
                        </div>
                        <div class="text-break" wicket:id="message"></div>
                    </div>
                    <a class="btn btn-sm px-1" wicket:id="detailLink">
                        <i class="fa fa-chevron-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</wicket:panel>
</html>
