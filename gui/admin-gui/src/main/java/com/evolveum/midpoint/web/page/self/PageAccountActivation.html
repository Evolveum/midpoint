<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
    <form wicket:id="mainForm" class="form-horizontal">
        <ul class="list-unstyled mb-3">
            <li class="d-flex gap-1 align-items-center" wicket:id="accounts">
                <i class="fa fa-user-circle"/>
                <span wicket:id="accountName"/>
            </li>
        </ul>
        <p class="text-center" wicket:id="nothingToActivate"/>
        <div class="d-flex justify-content-center">
            <a class="btn btn-primary" wicket:id="activate"/>
        </div>
    </form>
</wicket:extend>
</body>
</html>
