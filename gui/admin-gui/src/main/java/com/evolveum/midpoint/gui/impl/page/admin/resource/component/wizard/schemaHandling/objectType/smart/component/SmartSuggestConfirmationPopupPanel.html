<wicket:panel xmlns:wicket="http://wicket.apache.org">
    <div wicket:id="content"></div>

    <wicket:fragment wicket:id="buttons">
        <div class="d-flex justify-content-between align-items-center flex-wrap w-100">
            <div>
                <a class="btn btn-link" wicket:id="no"></a>
            </div>

            <div class="d-flex gap-2">
                <a class="btn btn light border" wicket:id="additionalButtons"></a>
                <a class="btn btn-primary" wicket:id="yes"></a>
            </div>
        </div>
    </wicket:fragment>

    <wicket:fragment wicket:id="aiInfo">
        <div class="d-flex align-items-center border rounded p-2 m-2 gap-2">

            <div class="bg-light rounded d-flex align-items-center justify-content-center p-2">
                <i class="fa fa-microchip fa-2x text-body-secondary"></i>
            </div>

            <div class="flex-grow-1">
                <div class="fw-semibold" wicket:id="aiProvider"></div>
                <div class="text-muted" wicket:id="aiModel"></div>
            </div>

            <div class="d-flex align-items-center fw-semibold me-3" wicket:id="aiStatusContainer">
                <i class="fa fa-circle me-1" style="font-size:.6rem;"></i>
                <span wicket:id="aiStatus"></span>
            </div>
        </div>
    </wicket:fragment>
</wicket:panel>
