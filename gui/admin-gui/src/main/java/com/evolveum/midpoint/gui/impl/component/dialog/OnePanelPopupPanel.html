<wicket:panel xmlns:wicket="http://wicket.apache.org">
    <div wicket:id="panel"/>

    <wicket:fragment wicket:id="buttons">
        <div class="d-flex">
            <div class="ms-auto d-flex">
                <a wicket:id="cancelButton" class="btn btn-default me-2">
                    <span><wicket:message key="Button.cancel"/></span>
                </a>
                <a wicket:id="doneButton" class="btn btn-primary">
                    <span><wicket:message key="OnePanelPopupPanel.button.done"/></span>
                </a>
            </div>
        </div>
    </wicket:fragment>
</wicket:panel>
