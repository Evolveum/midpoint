<html xmlns:wicket="http://wicket.apache.org">
<wicket:panel>
    <form wicket:id="mainForm">
        <div class="feedbackContainer">
            <div wicket:id="popupFeedback" class="messagePanel"/>
        </div>
        <label wicket:for="file" class="form-label">
            <wicket:message key="DocumentationUploadPopupPanel.file"/>
        </label>
        <input wicket:id="file" type="file" class="form-control"/>
    </form>

    <wicket:fragment wicket:id="buttons">
        <div class="d-flex gap-2 w-100">
            <a wicket:id="cancel" class="ms-auto btn btn-light border"/>
            <a wicket:id="upload" class="btn btn-primary"/>
        </div>
    </wicket:fragment>
</wicket:panel>
</html>
