<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<wicket:panel>
    <i class="me-2 mt-1" wicket:id="icon"></i>
    <div>
        <div class="fw-bold" wicket:id="title"></div>
        <span wicket:id="text"></span>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" wicket:message="aria-label:Button.close" wicket:id="close"></button>
</wicket:panel>
</html>
